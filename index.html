<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>شفا Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: #eee;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 4em;
      color: #006400; /* dark green */
      font-weight: 300;
      margin-bottom: 20px;
    }
    video {
      width: 80%;
      margin: 20px auto;
      display: block;
      background: black;
      border-radius: 10px;
    }
    #controls {
      margin: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .speed-btn, .control-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #eee;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .speed-btn:hover, .control-btn:hover {
      background: #555;
      transform: scale(1.05);
    }
    .speed-btn.active {
      background: #006400;
      color: #fff;
      font-weight: bold;
    }
    #fileInput {
      margin: 15px;
      padding: 10px 20px;
      border-radius: 6px;
      background: #000;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid #888;
      transition: background 0.3s, color 0.3s, border 0.3s;
    }
    #fileInput:hover {
      background: #222;
      border-color: #666;
      color: #00ff00;
    }
  </style>
</head>
<body>
  <h1>شفا</h1>

  <!-- File selector -->
  <input type="file" id="fileInput" accept="video/*">

  <!-- Video player with only seek bar -->
  <video id="player" controls controlsList="nodownload noplaybackrate"></video>

  <div id="controls">
    <!-- Popup Player -->
    <button class="control-btn" id="popupBtn">Popup Player</button>

    <!-- Speed buttons -->
    <button class="speed-btn" onclick="setBaseSpeed(1,this)">1x</button>
    <button class="speed-btn" onclick="setBaseSpeed(1.5,this)">1.5x</button>
    <button class="speed-btn" onclick="setBaseSpeed(1.75,this)">1.75x</button>
    <button class="speed-btn" onclick="setBaseSpeed(2,this)">2x</button>

    <!-- Fullscreen -->
    <button class="control-btn" id="fullscreenBtn">Fullscreen</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const fileInput = document.getElementById('fileInput');
    const buttons = document.querySelectorAll('.speed-btn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const popupBtn = document.getElementById('popupBtn');

    // --- Load selected video ---
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        player.src = url;
        player.load();
      }
    });

    // --- Double-tap skip (YouTube style) ---
    let lastTap = 0;
    player.addEventListener('click', (e) => {
      const currentTime = new Date().getTime();
      if (currentTime - lastTap < 300) {
        if (e.offsetX < player.offsetWidth / 2) {
          player.currentTime = Math.max(0, player.currentTime - 10); // rewind
        } else {
          player.currentTime = Math.min(player.duration, player.currentTime + 10); // forward
        }
      }
      lastTap = currentTime;
    });

    // --- Silence skipping ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(player);
    const analyser = audioCtx.createAnalyser();
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    analyser.fftSize = 1024;
    const bufferLength = analyser.fftSize;
    const dataArray = new Uint8Array(bufferLength);

    const silenceThreshold = 5;
    let baseSpeed = 1;
    const fastForwardSpeed = 7;

    function checkSilence() {
      analyser.getByteFrequencyData(dataArray);
      const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength;

      if (avg < silenceThreshold && !player.paused) {
        player.playbackRate = fastForwardSpeed;
      } else {
        player.playbackRate = baseSpeed;
      }

      requestAnimationFrame(checkSilence);
    }

    document.body.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    checkSilence();

    // --- Set baseline speed ---
    function setBaseSpeed(rate, btn) {
      baseSpeed = rate;
      player.playbackRate = baseSpeed;
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // --- Fullscreen toggle ---
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        if (player.requestFullscreen) player.requestFullscreen();
        else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });

    // --- Popup Player ---
    popupBtn.addEventListener('click', () => {
      const popup = window.open("", "popupPlayer", "width=600,height=400");
      popup.document.write("<title>Popup Player</title>");
      popup.document.write("<video src='" + player.src + "' controls autoplay style='width:100%;height:100%;background:black'></video>");
    });
  </script>
</body>
</html>
