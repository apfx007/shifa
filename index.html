<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>شفا Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: #eee;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 4em;
      color: #006400;
      font-weight: 300;
      margin-bottom: 20px;
    }
    video {
      width: 80%;
      margin: 20px auto;
      display: block;
      background: black;
      border-radius: 10px;
    }
    #seekBar {
      width: 80%;
      margin: 10px auto;
      display: block;
    }
    #controls {
      margin: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #eee;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .btn:hover {
      background: #555;
      transform: scale(1.05);
    }
    .btn.active {
      background: #006400;
      color: #fff;
      font-weight: bold;
    }
    #timeDisplay {
      font-size: 14px;
      margin-top: 5px;
    }
    #fileInput {
      margin: 15px;
      padding: 10px 20px;
      border-radius: 6px;
      background: #000;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid #888;
      transition: background 0.3s, color 0.3s, border 0.3s;
    }
    #fileInput:hover {
      background: #222;
      border-color: #666;
      color: #00ff00;
    }
  </style>
</head>
<body>
  <h1>شفا</h1>

  <input type="file" id="fileInput" accept="video/*">
  <video id="player"></video>

  <!-- Custom seek bar -->
  <input type="range" id="seekBar" value="0" min="0" step="0.1">
  <div id="timeDisplay">00:00 / 00:00</div>

  <!-- Custom controls -->
  <div id="controls">
    <button class="btn" id="playPauseBtn">Play</button>
    <button class="btn" onclick="setBaseSpeed(1,this)">1x</button>
    <button class="btn" onclick="setBaseSpeed(1.5,this)">1.5x</button>
    <button class="btn" onclick="setBaseSpeed(1.75,this)">1.75x</button>
    <button class="btn" onclick="setBaseSpeed(2,this)">2x</button>
    <button class="btn" id="fullscreenBtn">Fullscreen</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const fileInput = document.getElementById('fileInput');
    const buttons = document.querySelectorAll('.btn');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // Load selected video
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        player.src = url;
        player.load();
      }
    });

    // Double-tap skip
    let lastTap = 0;
    player.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      if (currentTime - lastTap < 300) {
        const touch = e.changedTouches[0];
        const rect = player.getBoundingClientRect();
        const x = touch.clientX - rect.left;
        if (x < player.offsetWidth / 2) {
          player.currentTime = Math.max(0, player.currentTime - 10);
        } else {
          player.currentTime = Math.min(player.duration, player.currentTime + 10);
        }
      }
      lastTap = currentTime;
    });

    // Seek bar
    player.addEventListener('timeupdate', () => {
      seekBar.value = player.currentTime;
      seekBar.max = player.duration;
      updateTimeDisplay();
    });
    seekBar.addEventListener('input', () => {
      player.currentTime = seekBar.value;
    });

    // Time display
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }
    function updateTimeDisplay() {
      const current = formatTime(player.currentTime);
      const total = formatTime(player.duration || 0);
      timeDisplay.textContent = `${current} / ${total}`;
    }

    // Play/pause
    playPauseBtn.addEventListener('click', () => {
      if (player.paused) {
        player.play();
        playPauseBtn.textContent = "Pause";
      } else {
        player.pause();
        playPauseBtn.textContent = "Play";
      }
    });

    // Fullscreen
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        player.requestFullscreen?.() || player.webkitRequestFullscreen?.();
      } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.();
      }
    });

    // Silence skipping
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(player);
    const analyser = audioCtx.createAnalyser();
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    analyser.fftSize = 1024;
    const bufferLength = analyser.fftSize;
    const dataArray = new Uint8Array(bufferLength);
    const silenceThreshold = 5;
    let baseSpeed = 1;
    const fastForwardSpeed = 7;

    function checkSilence() {
      analyser.getByteFrequencyData(dataArray);
      const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength;
      if (avg < silenceThreshold && !player.paused) {
        player.playbackRate = fastForwardSpeed;
      } else {
        player.playbackRate = baseSpeed;
      }
      requestAnimationFrame(checkSilence);
    }
    document.body.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    });
    checkSilence();

    // Speed buttons
    function setBaseSpeed(rate, btn) {
      baseSpeed = rate;
      player.playbackRate = baseSpeed;
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
