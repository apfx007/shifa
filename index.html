<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silence-Skipping Video Player</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: #eee;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 4em; /* double size */
      color: #006400; /* dark green */
      font-weight: 300; /* slim look */
      margin-bottom: 20px;
    }
    video {
      width: 80%;
      margin: 20px auto;
      display: block;
      background: black;
      border-radius: 10px;
    }
    #controls {
      margin: 20px;
    }
    .speed-btn {
      margin: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #eee;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .speed-btn:hover {
      background: #555;
      transform: scale(1.05);
    }
    .speed-btn.active {
      background: #006400; /* dark green highlight */
      color: #fff;
      font-weight: bold;
    }
    #fileInput {
      margin: 15px;
      padding: 10px 20px;
      border-radius: 6px;
      background: #000; /* black */
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid #888; /* subtle dark outline */
      transition: background 0.3s, color 0.3s, border 0.3s;
    }
    #fileInput:hover {
      background: #222;
      border-color: #666; /* darker outline on hover */
      color: #00ff00;
    }
  </style>
</head>
<body>
  <h1>شفا</h1>

  <!-- File selector -->
  <input type="file" id="fileInput" accept="video/*">

  <!-- Video wrapped in container for fullscreen -->
  <div id="videoContainer">
    <video id="player" controls controlsList="nodownload"></video>
  </div>

  <div id="controls">
    <button class="speed-btn" onclick="setBaseSpeed(1,this)">1x</button>
    <button class="speed-btn" onclick="setBaseSpeed(1.5,this)">1.5x</button>
    <button class="speed-btn" onclick="setBaseSpeed(1.75,this)">1.75x</button>
    <button class="speed-btn" onclick="setBaseSpeed(2,this)">2x</button>
    <button class="speed-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const fileInput = document.getElementById('fileInput');
    const buttons = document.querySelectorAll('.speed-btn');
    const videoContainer = document.getElementById('videoContainer');

    // --- Load selected video ---
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        player.src = url;
        player.load();
      }
    });

    // --- Double-tap skip ---
    let lastTap = 0;
    player.addEventListener('click', (e) => {
      const currentTime = new Date().getTime();
      if (currentTime - lastTap < 300) {
        if (e.clientX < player.offsetWidth / 2) {
          player.currentTime = Math.max(0, player.currentTime - 10);
        } else {
          player.currentTime = Math.min(player.duration, player.currentTime + 10);
        }
      }
      lastTap = currentTime;
    });

    // --- Silence skipping ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(player);
    const analyser = audioCtx.createAnalyser();
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    analyser.fftSize = 1024;
    const bufferLength = analyser.fftSize;
    const dataArray = new Uint8Array(bufferLength);

    const silenceThreshold = 5;   // sensitivity
    let baseSpeed = 1;            // baseline playback speed
    const fastForwardSpeed = 7;   // fixed fast-forward speed

    function checkSilence() {
      analyser.getByteFrequencyData(dataArray);
      const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength;

      if (avg < silenceThreshold && !player.paused) {
        player.playbackRate = fastForwardSpeed; // fixed 7x
      } else {
        player.playbackRate = baseSpeed;        // baseline speed
      }

      requestAnimationFrame(checkSilence);
    }

    document.body.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    checkSilence();

    // --- Set baseline speed from buttons ---
    function setBaseSpeed(rate, btn) {
      baseSpeed = rate;
      player.playbackRate = baseSpeed; // apply immediately
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // --- Fullscreen toggle (works in Firefox, Chrome, Safari) ---
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (videoContainer.requestFullscreen) {
          videoContainer.requestFullscreen();
        } else if (videoContainer.webkitRequestFullscreen) { // Safari
          videoContainer.webkitRequestFullscreen();
        } else if (videoContainer.msRequestFullscreen) { // IE/Edge
          videoContainer.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
