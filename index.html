<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Video Player</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 600px; margin: auto; }
    h2 { text-align: left; }
    input[type="file"] { margin: 10px 0; }
    video { width: 100%; max-height: 400px; background: #000; }
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 70%; /* gesture zone only top 70% */
      display: flex;
      justify-content: space-between;
      pointer-events: none; /* let clicks pass through by default */
    }
    .tap-zone {
      flex: 1;
      pointer-events: auto; /* zones capture events */
    }
    .player-wrapper {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Player name -->
    <h2>شفا</h2>

    <!-- File chooser -->
    <input type="file" id="fileInput" accept="video/*">

    <!-- Video player with overlay zones -->
    <div class="player-wrapper">
      <video id="videoPlayer" controls controlsList="nodownload"></video>
      <div class="overlay">
        <div class="tap-zone" id="leftZone"></div>
        <div class="tap-zone" id="middleZone"></div>
        <div class="tap-zone" id="rightZone"></div>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const videoPlayer = document.getElementById('videoPlayer');
    const leftZone = document.getElementById('leftZone');
    const rightZone = document.getElementById('rightZone');
    const middleZone = document.getElementById('middleZone');

    fileInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        videoPlayer.src = fileURL;
        videoPlayer.play();
      }
    });

    // Double-tap / double-click detection
    let lastTapLeft = 0;
    let lastTapRight = 0;

    function rewind() {
      videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 10);
    }
    function forward() {
      videoPlayer.currentTime = Math.min(videoPlayer.duration, videoPlayer.currentTime + 10);
    }

    // Show controls temporarily
    function showControlsTemporarily() {
      videoPlayer.controls = true;
      setTimeout(() => {
        videoPlayer.controls = false;
        videoPlayer.controls = true; // reset to default state
      }, 3000);
    }

    // Mobile touch
    leftZone.addEventListener('touchend', function() {
      const now = Date.now();
      if (now - lastTapLeft < 300) {
        rewind();
      } else {
        showControlsTemporarily();
      }
      lastTapLeft = now;
    });

    rightZone.addEventListener('touchend', function() {
      const now = Date.now();
      if (now - lastTapRight < 300) {
        forward();
      } else {
        showControlsTemporarily();
      }
      lastTapRight = now;
    });

    middleZone.addEventListener('touchend', function() {
      if (videoPlayer.paused) videoPlayer.play();
      else videoPlayer.pause();
    });

    // Desktop click
    leftZone.addEventListener('dblclick', rewind);
    rightZone.addEventListener('dblclick', forward);
    leftZone.addEventListener('click', showControlsTemporarily);
    rightZone.addEventListener('click', showControlsTemporarily);
    middleZone.addEventListener('click', function() {
      if (videoPlayer.paused) videoPlayer.play();
      else videoPlayer.pause();
    });
  </script>
</body>
</html>
