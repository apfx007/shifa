<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student's Player</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: #eee;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 4em;
      color: #006400;
      font-weight: 300;
      margin-bottom: 20px;
    }
    video {
      width: 80%;
      margin: 20px auto;
      display: block;
      background: black;
      border-radius: 10px;
    }
    #controls {
      margin: 20px;
    }
    .speed-btn {
      margin: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #eee;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .speed-btn:hover {
      background: #555;
      transform: scale(1.05);
    }
    .speed-btn.active {
      background: #006400;
      color: #fff;
      font-weight: bold;
    }
    #fileInput {
      margin: 15px;
      padding: 10px 20px;
      border-radius: 6px;
      background: #000;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid #888;
      transition: background 0.3s, color 0.3s, border 0.3s;
    }
    #fileInput:hover {
      background: #222;
      border-color: #666;
      color: #00ff00;
    }

    /* Overlay styles */
    .overlay {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.85);
      font-size: 3em;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
    }
    .overlay.center {
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .overlay.left {
      left: 20%;
    }
    .overlay.right {
      right: 20%;
    }
    .overlay.show {
      opacity: 1;
      animation: fadeOut 0.8s forwards;
    }
    @keyframes fadeOut {
      0% { opacity: 1; transform: translateY(-50%) scale(1.2); }
      100% { opacity: 0; transform: translateY(-50%) scale(1); }
    }
  </style>
</head>
<body>
  <h1>شفا</h1>

  <!-- File selector -->
  <input type="file" id="fileInput" accept="video/*">

  <!-- Video wrapped in container for fullscreen -->
  <div id="videoContainer" style="position:relative;">
    <video id="player" controls controlsList="nodownload"></video>
    <div id="overlayCenter" class="overlay center"></div>
    <div id="overlayLeft" class="overlay left"></div>
    <div id="overlayRight" class="overlay right"></div>
  </div>

  <div id="controls">
    <button class="speed-btn" onclick="setBaseSpeed(1,this)">1x</button>
    <button class="speed-btn" onclick="setBaseSpeed(1.5,this)">1.5x</button>
    <button class="speed-btn" onclick="setBaseSpeed(1.75,this)">1.75x</button>
    <button class="speed-btn" onclick="setBaseSpeed(2,this)">2x</button>
    <button class="speed-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const fileInput = document.getElementById('fileInput');
    const buttons = document.querySelectorAll('.speed-btn');
    const videoContainer = document.getElementById('videoContainer');

    const overlayCenter = document.getElementById('overlayCenter');
    const overlayLeft = document.getElementById('overlayLeft');
    const overlayRight = document.getElementById('overlayRight');

    // --- Load selected video ---
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        player.src = url;
        player.load();
      }
    });

    // --- Overlay helper ---
    function showOverlay(element, text) {
      element.textContent = text;
      element.classList.add('show');
      setTimeout(() => element.classList.remove('show'), 800);
    }

    // --- Gesture controls (click + touch) ---
    let lastTap = 0;
    function handleTap(e) {
      const currentTime = new Date().getTime();
      const rect = player.getBoundingClientRect();
      const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
      const x = clientX - rect.left;
      const middleZone = rect.width * 0.3;

      if (currentTime - lastTap < 300) {
        // Double tap
        if (x < rect.width / 2) {
          player.currentTime = Math.max(0, player.currentTime - 10);
          showOverlay(overlayLeft, "⏪ 10s");
        } else {
          player.currentTime = Math.min(player.duration, player.currentTime + 10);
          showOverlay(overlayRight, "⏩ 10s");
        }
      } else {
        // Single tap in middle zone
        if (x > rect.width/2 - middleZone/2 && x < rect.width/2 + middleZone/2) {
          if (player.paused) {
            player.play();
            showOverlay(overlayCenter, "▶ Play");
          } else {
            player.pause();
            showOverlay(overlayCenter, "⏸ Pause");
          }
        }
      }
      lastTap = currentTime;
    }

    player.addEventListener('click', handleTap);
    player.addEventListener('touchend', handleTap);

    // --- Silence skipping (progressive playbackRate) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let source;
    try {
      source = audioCtx.createMediaElementSource(player);
    } catch (e) {
      // In some environments this can throw if called multiple times; ignore and continue
      console.warn('createMediaElementSource failed:', e);
    }

    const analyser = audioCtx.createAnalyser();
    if (source) source.connect(analyser);
    analyser.connect(audioCtx.destination);

    analyser.fftSize = 1024;
    const bufferLength = analyser.fftSize;
    const dataArray = new Uint8Array(bufferLength);

    const silenceThreshold = 5;
    let baseSpeed = 1;

    // Progressive fast-forward: 0-5s -> 2x, 5-10s -> 3x, 10s+ -> 4x
    let isFastForwarding = false;
    let ffStartTime = null;
    let ffTimerId = null;

    // Debounce to avoid flip-flopping on brief dips
    let silentFrames = 0;
    const silentFramesNeeded = 6; // about 100ms at 60fps

    function updateFastForwardRate() {
      if (!ffStartTime) return;
      const elapsed = (performance.now() - ffStartTime) / 1000;
      let newRate = 2;
      if (elapsed >= 10) newRate = 4;
      else if (elapsed >= 5) newRate = 3;

      if (player.playbackRate !== newRate) {
        player.playbackRate = newRate;
        // removed overlay here to avoid popups during automatic fast-forward
      }
    }

    function startProgressiveFastForward() {
      if (isFastForwarding) return;
      if (player.paused || player.ended) return;
      // Ensure AudioContext is running
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }

      isFastForwarding = true;
      ffStartTime = performance.now();
      // Keep audio audible
      player.muted = false;
      // Ensure playback continues
      player.play().catch(() => {});
      updateFastForwardRate();
      if (ffTimerId) clearInterval(ffTimerId);
      ffTimerId = setInterval(updateFastForwardRate, 200);
    }

    function stopProgressiveFastForward() {
      if (!isFastForwarding) return;
      isFastForwarding = false;
      ffStartTime = null;
      if (ffTimerId) {
        clearInterval(ffTimerId);
        ffTimerId = null;
      }
      // restore baseline speed and resume playback
      player.playbackRate = baseSpeed;
      player.play().catch(() => {});
      // removed overlay here so only play/pause/skip show overlays
    }

    function checkSilence() {
      // If AudioContext suspended (no user gesture yet), don't trigger
      if (audioCtx.state === 'suspended') {
        requestAnimationFrame(checkSilence);
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength;

      if (avg < silenceThreshold && !player.paused) {
        silentFrames++;
      } else {
        silentFrames = 0;
      }

      if (silentFrames >= silentFramesNeeded) {
        startProgressiveFastForward();
      } else if (isFastForwarding && avg >= silenceThreshold) {
        stopProgressiveFastForward();
      }

      requestAnimationFrame(checkSilence);
    }

    // ensure AudioContext is resumed on user interaction
    document.body.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    // stop ff on manual pause/ended
    player.addEventListener('pause', () => {
      if (isFastForwarding) stopProgressiveFastForward();
    });
    player.addEventListener('ended', () => {
      if (isFastForwarding) stopProgressiveFastForward();
    });

    checkSilence();

    // --- Set baseline speed from buttons ---
    function setBaseSpeed(rate, btn) {
      baseSpeed = rate;
      if (!isFastForwarding) {
        player.playbackRate = baseSpeed;
      }
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // --- Fullscreen toggle ---
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (videoContainer.requestFullscreen) {
          videoContainer.requestFullscreen();
        } else if (videoContainer.webkitRequestFullscreen) {
          videoContainer.webkitRequestFullscreen();
        } else if (videoContainer.msRequestFullscreen) {
          videoContainer.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
